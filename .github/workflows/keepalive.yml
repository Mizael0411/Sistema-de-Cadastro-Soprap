name: Supabase keepalive

on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Garantir cliente do PostgreSQL
        run: command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)

      - name: Consultar o banco
        env:
          PGHOST: aws-0-sa-east-1.pooler.supabase.com
          PGPORT: "6543"
          PGDATABASE: postgres
          PGUSER: ${{ secrets.SUPABASE_DB_USER }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGSSLMODE: require
        run: psql -v ON_ERROR_STOP=1 -c "select count(*) as animais from public.animal;"
